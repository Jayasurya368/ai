<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Teacher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F4EC;
    --paper-deep:#EFEBDD;
    --ink:#20231F;
    --ink-soft:#585B52;
    --ink-mute:#94978C;
    --line:#E2DFD3;
    --board:#26433A;
    --board-deep:#1B322A;
    --board-line:rgba(246,244,236,0.14);
    --gold:#D9A02C;
    --gold-deep:#A9760F;
    --gold-soft:#F6E6C2;
    --coral:#C15B45;
    --coral-soft:#F4DFD8;
    --shadow-card: 0 1px 1px rgba(32,35,31,0.04), 0 12px 24px -16px rgba(32,35,31,0.18);
    --shadow-rail: 2px 0 0 rgba(32,35,31,0.04);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{ font-family:'Fraunces', Georgia, serif; }

  .app{ display:flex; min-height:100vh; }

  /* ---------- Left rail ---------- */
  .rail{
    width:240px; flex-shrink:0; background:var(--paper-deep);
    border-right:1px solid var(--line);
    padding:32px 20px; display:flex; flex-direction:column; gap:6px;
    position:sticky; top:0; height:100vh;
  }
  .rail-brand{ display:flex; align-items:center; gap:10px; margin-bottom:34px; padding-left:4px; }
  .rail-brand .mark{
    width:30px; height:30px; border-radius:8px; background:var(--board);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .rail-brand span{ font-weight:700; font-size:14px; letter-spacing:0.2px; }

  .rail-step{
    display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:10px;
    cursor:default; color:var(--ink-mute); font-size:13.5px; font-weight:600;
    position:relative;
  }
  .rail-step .dot{
    width:20px; height:20px; border-radius:50%; border:1.5px solid var(--line);
    background:var(--paper); flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:700; color:var(--ink-mute);
  }
  .rail-step.active{ color:var(--ink); background:rgba(38,67,58,0.06); cursor:pointer; }
  .rail-step.active .dot{ border-color:var(--board); color:var(--board); background:var(--paper); }
  .rail-step.done .dot{ background:var(--board); border-color:var(--board); color:var(--paper); }
  .rail-step.done{ color:var(--ink-soft); cursor:pointer; }
  .rail-step.done:hover, .rail-step.active:hover{ background:rgba(38,67,58,0.09); }
  .rail-connector{ width:1px; height:14px; background:var(--line); margin-left:22px; }

  .rail-foot{ margin-top:auto; padding:14px 12px; border-top:1px solid var(--line); }
  .rail-foot .phase-tag{
    font-size:11px; font-weight:700; color:var(--gold-deep); letter-spacing:0.3px;
  }
  .rail-foot .phase-name{ font-size:12.5px; color:var(--ink-soft); margin-top:3px; line-height:1.4; }

  /* ---------- Main ---------- */
  .main{ flex:1; display:flex; justify-content:center; padding:56px 32px 100px; }
  .stage{ width:100%; max-width:660px; }

  .kicker{
    font-size:12.5px; font-weight:600; color:var(--ink-mute); margin:0 0 10px;
  }
  h1.page-title{ font-size:30px; font-weight:600; margin:0 0 12px; line-height:1.2; }
  p.page-sub{ color:var(--ink-soft); font-size:15px; line-height:1.6; margin:0 0 34px; max-width:480px; }

  .card{
    background:#fff; border:1px solid var(--line); border-radius:16px;
    padding:26px; margin-bottom:18px; box-shadow:var(--shadow-card);
  }

  /* ---------- Upload step ---------- */
  .dropzone{
    display:flex; flex-direction:column; align-items:center; gap:12px;
    padding:52px 20px; border:1.5px dashed #C9C5B4; border-radius:14px;
    cursor:pointer; text-align:center; transition:all .15s ease; background:var(--paper);
  }
  .dropzone:hover{ border-color:var(--gold); background:var(--gold-soft); }
  .dropzone input{ display:none; }
  .dz-icon{
    width:46px; height:46px; border-radius:50%; background:#fff; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
  }
  .dz-label{ font-size:14.5px; font-weight:600; }
  .dz-hint{ font-size:12px; color:var(--ink-mute); }

  .file-row{
    display:flex; align-items:center; gap:12px; padding:15px 16px;
    background:var(--gold-soft); border-radius:12px;
  }
  .file-row .f-icon{
    width:36px; height:36px; border-radius:9px; background:var(--gold-deep); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0;
  }
  .file-row .f-name{ font-size:13.5px; font-weight:600; flex:1; }
  .file-row .f-meta{ font-size:11.5px; color:var(--ink-soft); }
  .file-row .f-remove{ background:none; border:none; cursor:pointer; color:var(--ink-soft); font-size:17px; padding:4px; }

  .btn-primary{
    width:100%; padding:16px 20px; border-radius:12px; border:none;
    background:var(--board); color:#fff; font-size:14.5px; font-weight:600; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition: background .15s ease, transform .1s ease;
  }
  .btn-primary:hover:not(:disabled){ background:var(--board-deep); }
  .btn-primary:active:not(:disabled){ transform:translateY(1px); }
  .btn-primary:disabled{ background:var(--line); color:var(--ink-mute); cursor:not-allowed; }

  .btn-ghost{
    width:100%; padding:13px 18px; border-radius:10px; border:1px solid var(--line);
    background:#fff; color:var(--ink); font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .btn-ghost:hover{ border-color:var(--ink-mute); }

  /* ---------- Lesson step ---------- */
  .board-panel{
    background:var(--board); border-radius:16px; padding:0; overflow:hidden;
    margin-bottom:22px; box-shadow:var(--shadow-card);
  }
  .board-video{
    aspect-ratio:16/9; display:flex; align-items:center; justify-content:center;
    position:relative; background:
      repeating-linear-gradient(0deg, var(--board-line), var(--board-line) 1px, transparent 1px, transparent 42px),
      var(--board);
  }
  .avatar-ph{
    width:88px; height:88px; border-radius:50%; background:rgba(246,244,236,0.08);
    border:1.5px solid rgba(246,244,236,0.25); display:flex; align-items:center; justify-content:center;
  }
  .board-caption{
    color:var(--paper); font-family:'Fraunces',serif; font-size:15px; font-weight:500;
    position:absolute; bottom:20px; left:24px; right:24px; text-align:center; line-height:1.5;
    opacity:0.92;
  }
  .board-meta{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px; border-top:1px solid var(--board-line);
  }
  .board-meta .tag{ color:var(--gold-soft); font-size:11.5px; font-weight:700; letter-spacing:0.3px; }
  .board-meta .note{ color:rgba(246,244,236,0.55); font-size:11.5px; }

  .section-list{ display:flex; flex-direction:column; gap:10px; }
  .sec{
    background:#fff; border:1px solid var(--line); border-radius:14px; padding:20px 22px;
    display:flex; gap:16px; opacity:0.45; transition:opacity .3s ease;
  }
  .sec.unlocked{ opacity:1; }
  .sec-num{
    width:30px; height:30px; border-radius:9px; background:var(--paper-deep); color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif;
    font-weight:600; font-size:14px; flex-shrink:0;
  }
  .sec.unlocked .sec-num{ background:var(--board); color:var(--gold-soft); }
  .sec-title{ font-size:16px; font-weight:600; margin:1px 0 6px; font-family:'Fraunces',serif; }
  .sec-body{ font-size:13.5px; line-height:1.65; color:var(--ink-soft); margin:0 0 10px; }
  .sec-example{
    font-size:12.5px; line-height:1.6; color:var(--gold-deep); background:var(--gold-soft);
    border-radius:9px; padding:11px 13px; border-left:3px solid var(--gold);
  }
  .sec-example b{ display:block; font-size:10.5px; letter-spacing:0.3px; margin-bottom:3px; }

  .checkpoint{
    background:var(--paper-deep); border:1px dashed #C9C5B4; border-radius:12px; padding:18px 20px; margin-top:6px;
  }
  .checkpoint .cp-label{ font-size:11px; font-weight:700; color:var(--ink-mute); letter-spacing:0.3px; margin-bottom:8px; }
  .cp-opt{
    display:block; width:100%; text-align:left; padding:10px 12px; border-radius:9px;
    border:1px solid var(--line); background:#fff; font-size:13px; margin-bottom:7px; cursor:pointer;
  }
  .cp-opt:hover{ border-color:var(--gold); }

  /* ---------- Quiz step ---------- */
  .q-progress{ display:flex; gap:5px; margin-bottom:22px; }
  .q-progress i{ flex:1; height:4px; border-radius:3px; background:var(--line); }
  .q-progress i.done{ background:var(--board); }
  .q-num{ font-size:11.5px; font-weight:700; color:var(--gold-deep); letter-spacing:0.4px; margin:0 0 10px; }
  .q-prompt{ font-size:17px; font-weight:600; line-height:1.5; margin:0 0 20px; font-family:'Fraunces',serif; }
  .opt{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    padding:14px 15px; border-radius:11px; border:1.5px solid var(--line); background:#fff;
    font-size:14px; cursor:pointer; margin-bottom:9px; font-family:inherit;
  }
  .opt:hover{ border-color:var(--gold); }
  .opt.correct{ background:#E8EFE9; border-color:var(--board); }
  .opt.incorrect{ background:var(--coral-soft); border-color:var(--coral); }
  .opt .letter{
    width:24px; height:24px; border-radius:7px; background:var(--paper-deep); font-size:11.5px;
    font-weight:700; color:var(--ink-soft); display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }

  /* ---------- Report step ---------- */
  .score-hero{ text-align:center; padding:38px 20px 30px; }
  .score-hero .pct{ font-size:52px; font-weight:600; font-family:'Fraunces',serif; margin:14px 0 4px; }
  .score-hero .sub{ font-size:13.5px; color:var(--ink-soft); }
  .track-row{ display:flex; gap:14px; }
  .track{ flex:1; background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px; }
  .track .t-label{ font-size:11px; font-weight:700; letter-spacing:0.3px; margin-bottom:8px; }
  .track.strong .t-label{ color:var(--board); }
  .track.weak .t-label{ color:var(--coral); }
  .track ul{ margin:0; padding-left:16px; font-size:13px; color:var(--ink-soft); line-height:1.9; }
  .rec-card{ display:flex; gap:14px; align-items:flex-start; }
  .rec-icon{
    width:36px; height:36px; border-radius:10px; background:var(--gold-soft); color:var(--gold-deep);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .rec-title{ font-size:14px; font-weight:600; margin:0 0 4px; }
  .rec-body{ font-size:13.5px; color:var(--ink-soft); line-height:1.6; margin:0; }

  .field-label{ font-size:13.5px; font-weight:600; margin-bottom:12px; }
  .field-note{ font-weight:400; color:var(--ink-mute); font-size:12px; }
  .text-input{
    width:100%; padding:13px 14px; border-radius:10px; border:1.5px solid var(--line);
    font-size:14px; font-family:inherit; background:var(--paper);
  }
  .text-input:focus{ outline:none; border-color:var(--gold); }
  .choice-row{ display:flex; flex-wrap:wrap; gap:9px; }
  .choice-pill{
    padding:10px 15px; border-radius:999px; border:1.5px solid var(--line); background:#fff;
    font-size:13px; font-weight:600; cursor:pointer; color:var(--ink-soft); font-family:inherit;
  }
  .choice-pill:hover{ border-color:var(--gold); }
  .choice-pill.selected{ background:var(--board); border-color:var(--board); color:var(--paper); }

  .mode-toggle{ display:flex; gap:8px; margin-bottom:18px; background:var(--paper-deep); padding:5px; border-radius:12px; width:fit-content; }
  .mode-btn{
    padding:9px 16px; border-radius:9px; border:none; background:transparent; cursor:pointer;
    font-size:13px; font-weight:600; color:var(--ink-soft); font-family:inherit;
  }
  .mode-btn.active{ background:#fff; color:var(--ink); box-shadow:var(--shadow-card); }

  .preview-row{
    display:flex; justify-content:space-between; gap:16px; padding:10px 0; border-bottom:1px solid var(--line);
    font-size:13.5px;
  }
  .preview-row:last-of-type{ border-bottom:none; }
  .preview-row .p-key{ color:var(--ink-mute); font-weight:600; flex-shrink:0; }
  .preview-row .p-val{ text-align:right; color:var(--ink); }

  .spinner{
    width:14px; height:14px; border:2px solid rgba(255,255,255,0.4); border-top-color:#fff;
    border-radius:50%; display:inline-block; animation:spin .8s linear infinite; vertical-align:-2px;
  }
  .spinner.dark{ border:2px solid var(--line); border-top-color:var(--gold-deep); }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .rag-card #ragAskBtn{ flex-shrink:0; }
  .rag-card .text-input{ flex:1; }
  #chatLog{ display:flex; flex-direction:column; gap:10px; max-height:280px; overflow-y:auto; }
  .chat-bubble{ padding:11px 14px; border-radius:12px; font-size:13.5px; line-height:1.55; max-width:88%; }
  .chat-bubble.student{ align-self:flex-end; background:var(--board); color:var(--paper); border-bottom-right-radius:4px; }
  .chat-bubble.teacher{ align-self:flex-start; background:var(--paper-deep); color:var(--ink); border-bottom-left-radius:4px; }
  .chat-source{ font-size:10px; font-weight:700; color:var(--gold-deep); letter-spacing:0.3px; margin-bottom:5px; }

  .fade-in{ animation:fadeIn .35s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  @media (max-width:760px){
    .rail{ display:none; }
    .main{ padding:32px 18px 80px; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- LEFT RAIL -->
  <nav class="rail" id="rail"></nav>

  <!-- MAIN STAGE -->
  <main class="main"><div class="stage" id="stage"></div></main>
</div>

<script>
const STEPS = ['onboarding','upload','lesson','quiz','report'];
const STEP_LABEL = { onboarding:'Get to know you', upload:'Upload material', lesson:'Lesson', quiz:'Check understanding', report:'Report' };
let current = 'onboarding';
let completed = [];
let student = { name:'', level:'', time:'', language:'English' };
let inputMode = 'pdf'; // 'pdf' or 'topic'
let fileName = null, fileSize = null, selectedFile = null;
let topicText = '';
let lessonSummary = '';
let SECTIONS = [];
let QUIZ = [];
let classroomChat = [];

/* ---------------- PHASE 7: D-ID avatar video ---------------- */
const DID_PROXY_URL = '/api/did-clip'; // serverless proxy — key lives server-side now, not here

async function generateAvatarVideo(){
  const tag = document.getElementById('avatarTag');
  const note = document.getElementById('avatarNote');
  const panel = document.getElementById('boardVideo');
  if (!tag || !panel) return;

  const script = (lessonSummary || 'Welcome to your lesson.').slice(0, 550);

  try{
    console.log('[D-ID] Creating clip via proxy');
    const createRes = await fetch(DID_PROXY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ script }),
    });
    const createData = await createRes.json();
    console.log('[D-ID] Create response:', createRes.status, createData);
    if (!createRes.ok) throw new Error('(' + createRes.status + ') ' + (createData.description || createData.message || createData.error || JSON.stringify(createData)));
    const clipId = createData.id;

    let resultUrl = null;
    for (let i = 0; i < 20; i++){
      await new Promise(r => setTimeout(r, 3000));
      const pollRes = await fetch(DID_PROXY_URL + '?id=' + encodeURIComponent(clipId));
      const pollData = await pollRes.json();
      console.log('[D-ID] Poll response:', pollRes.status, pollData);
      if (pollData.status === 'done'){ resultUrl = pollData.result_url; break; }
      if (pollData.status === 'error' || pollData.status === 'rejected'){
        throw new Error(pollData.error && pollData.error.description ? pollData.error.description : 'Video generation failed (status: ' + pollData.status + ').');
      }
      if (tag) tag.textContent = 'GENERATING AVATAR VIDEO… (' + pollData.status + ')';
    }
    if (!resultUrl) throw new Error('Timed out waiting for the video.');

    const currentPanel = document.getElementById('boardVideo');
    if (currentPanel){
      currentPanel.innerHTML = `<video src="${resultUrl}" controls autoplay style="width:100%; height:100%; object-fit:cover; display:block;"></video>`;
    }
    const currentTag = document.getElementById('avatarTag');
    const currentNote = document.getElementById('avatarNote');
    if (currentTag) currentTag.textContent = 'AVATAR VIDEO READY';
    if (currentNote) currentNote.textContent = 'Generated via D-ID';
  }catch(err){
    console.error('[D-ID] Generation failed:', err);
    if (tag) tag.textContent = 'AVATAR VIDEO UNAVAILABLE';
    const currentPanel = document.getElementById('boardVideo');
    if (note){
      note.innerHTML = escapeHtml(err.message) + ' &nbsp;<a href="#" id="retryAvatarBtn" style="color:var(--gold-soft); text-decoration:underline;">Retry</a>';
      const retryBtn = document.getElementById('retryAvatarBtn');
      if (retryBtn) retryBtn.addEventListener('click', (e) => { e.preventDefault(); generateAvatarVideo(); });
    }
  }
}
let unlockedSections = 0;
const TOTAL_SECTIONS = 3;
let quizIndex = 0;
let quizScore = 0;

function renderRail(){
  const rail = document.getElementById('rail');
  let html = `<div class="rail-brand"><div class="mark">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#F6E6C2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5-10-5z"/><path d="M6 12v5c0 2 3 3 6 3s6-1 6-3v-5"/></svg>
    </div><span>AI Teacher</span></div>`;
  STEPS.forEach((s, i) => {
    const isDone = completed.includes(s);
    const isActive = s === current;
    const cls = isDone ? 'done' : (isActive ? 'active' : '');
    const num = isDone ? '&#10003;' : (i+1);
    html += `<div class="rail-step ${cls}" onclick="goStep('${s}', ${isDone || isActive})">
      <div class="dot">${num}</div><span>${STEP_LABEL[s]}</span></div>`;
    if (i < STEPS.length - 1) html += `<div class="rail-connector"></div>`;
  });
  html += `<div class="rail-foot"><div class="phase-tag">PHASE 7</div><div class="phase-name">Video + Avatar + Voice — real D-ID generated talking-head video for the lesson intro</div></div>`;
  rail.innerHTML = html;
}

function goStep(step, allowed){
  if (!allowed) return;
  current = step;
  renderRail();
  renderStage();
}

function markDone(step){
  if (!completed.includes(step)) completed.push(step);
}

function renderStage(){
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  if (current === 'onboarding') renderOnboarding(stage);
  if (current === 'upload') renderUpload(stage);
  if (current === 'lesson') renderLesson(stage);
  if (current === 'quiz') renderQuiz(stage);
  if (current === 'report') renderReport(stage);
}

/* ---------------- ONBOARDING ---------------- */
const LEVELS = ['New to this', 'Some background', 'Comfortable already'];
const TIMES = ['5 minutes', '15 minutes', '30+ minutes'];
const LANGS = ['English', 'Spanish', 'Hindi', 'Tamil'];

function renderOnboarding(stage){
  stage.innerHTML = `
    <p class="kicker">STEP 1 OF 5</p>
    <h1 class="page-title">Before we start, a few quick things</h1>
    <p class="page-sub">This shapes how the lesson gets explained and how long it runs — nothing here is a test.</p>
    <div class="card">
      <div class="field-label">What should we call you?</div>
      <input type="text" id="nameInput" class="text-input" placeholder="Your name" value="${escapeHtml(student.name)}" />
    </div>
    <div class="card">
      <div class="field-label">How familiar are you with this kind of material, generally?</div>
      <div class="choice-row" id="levelRow">
        ${LEVELS.map(l => `<button class="choice-pill ${student.level===l?'selected':''}" data-v="${l}">${l}</button>`).join('')}
      </div>
    </div>
    <div class="card">
      <div class="field-label">How much time do you have right now?</div>
      <div class="choice-row" id="timeRow">
        ${TIMES.map(t => `<button class="choice-pill ${student.time===t?'selected':''}" data-v="${t}">${t}</button>`).join('')}
      </div>
    </div>
    <div class="card">
      <div class="field-label">Preferred language <span class="field-note">(more languages arrive in a later phase)</span></div>
      <div class="choice-row" id="langRow">
        ${LANGS.map(l => `<button class="choice-pill ${student.language===l?'selected':''}" data-v="${l}">${l}</button>`).join('')}
      </div>
    </div>
    <button class="btn-primary" id="onboardNext" ${(!student.level || !student.time) ? 'disabled' : ''}>
      Continue
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </button>
  `;
  document.getElementById('nameInput').addEventListener('input', (e) => { student.name = e.target.value; });
  wireChoiceRow('levelRow', v => { student.level = v; updateOnboardBtn(); });
  wireChoiceRow('timeRow', v => { student.time = v; updateOnboardBtn(); });
  wireChoiceRow('langRow', v => { student.language = v; });
  document.getElementById('onboardNext').addEventListener('click', () => {
    markDone('onboarding');
    goStep('upload', true);
  });
}

function arrayBufferToBase64(buffer){
  let binary = '';
  const bytes = new Uint8Array(buffer);
  const chunkSize = 0x8000;
  for (let i=0;i<bytes.length;i+=chunkSize){
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunkSize));
  }
  return btoa(binary);
}

function buildInstructions(){
  return 'You are an AI teacher. Build a short lesson and a 4-question multiple choice quiz, personalized for this student:\n' +
    '- Familiarity level: ' + (student.level || 'some background') + '\n' +
    '- Time available: ' + (student.time || '15 minutes') + '\n\n' +
    'Do two things:\n' +
    '1) Build a teaching lesson that explains the key concepts clearly, as a real teacher would — a plain-language explanation plus a concrete example for each concept. Match the depth and length to the time available and familiarity level above.\n' +
    '2) Build 4 multiple-choice questions checking understanding of those exact concepts (do not invent facts not supported by the material).\n\n' +
    'Respond with ONLY a JSON object (no markdown fences, no preamble) in exactly this shape:\n' +
    '{\n' +
    '  "lesson": {\n' +
    '    "summary": "1-2 sentence overview of what this lesson covers",\n' +
    '    "sections": [ { "heading": "Concept name", "explanation": "Clear explanation", "example": "A concrete example or analogy" } ]\n' +
    '  },\n' +
    '  "quiz": [ { "question": "...", "options": ["...","...","...","..."], "correctIndex": 0, "explanation": "..." } ]\n' +
    '}\n\n' +
    'Include 3 lesson sections.';
}

async function generateLessonAndQuiz(){
  let messageContent;
  if (inputMode === 'pdf' && selectedFile){
    const buf = await selectedFile.arrayBuffer();
    const base64 = arrayBufferToBase64(buf);
    messageContent = [
      { type:'document', source:{ type:'base64', media_type:'application/pdf', data: base64 } },
      { type:'text', text: buildInstructions() },
    ];
  } else {
    messageContent = 'Topic to teach: "' + topicText.trim() + '"\n\n' + buildInstructions();
  }

  const response = await fetch('/api/claude-message', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 3000,
      messages: [{ role:'user', content: messageContent }],
    }),
  });
  const data = await response.json();
  const textBlock = (data.content || []).find(b => b.type === 'text');
  if (!textBlock) throw new Error('No response from the model.');
  const clean = textBlock.text.replace(/```json|```/g, '').trim();
  const parsed = JSON.parse(clean);

  lessonSummary = parsed.lesson.summary;
  SECTIONS = parsed.lesson.sections.map(s => ({ title: s.heading, body: s.explanation, example: s.example }));
  QUIZ = parsed.quiz.map(q => ({ q: q.question, opts: q.options, correct: q.correctIndex, explain: q.explanation }));
}

/* ---------------- RAG: lexical retrieval over lesson chunks ---------------- */
function tokenize(str){
  return (str || '').toLowerCase().match(/[a-z0-9]+/g) || [];
}
const STOPWORDS = new Set(['the','a','an','is','are','of','to','and','in','on','for','it','that','this','what','how','why','does','do','can','you','your','i','me','my','be','was','were','with','as','at','by','or']);

function scoreChunk(queryTokens, chunkText){
  const chunkTokens = tokenize(chunkText);
  const chunkSet = {};
  chunkTokens.forEach(t => { chunkSet[t] = (chunkSet[t]||0) + 1; });
  let score = 0;
  queryTokens.forEach(qt => { if (chunkSet[qt]) score += chunkSet[qt]; });
  return score;
}

function retrieveChunks(question, topK){
  const queryTokens = tokenize(question).filter(t => !STOPWORDS.has(t));
  const chunks = SECTIONS.map((s, i) => ({
    index: i,
    title: s.title,
    text: s.title + '. ' + s.body + ' ' + s.example,
  }));
  const scored = chunks.map(c => ({ ...c, score: scoreChunk(queryTokens, c.text) }));
  scored.sort((a,b) => b.score - a.score);
  const withSignal = scored.filter(c => c.score > 0);
  return (withSignal.length ? withSignal : scored).slice(0, topK);
}

function answerQuiz(i){
  const q = QUIZ[quizIndex];
  const opts = document.querySelectorAll('#optsWrap .opt');

    b.disabled = true;

  if (i === q.correct) quizScore++;
  document.getElementById('explainWrap').innerHTML =
    `<div class="checkpoint fade-in" style="margin-top:14px;"><div class="cp-label">WHY</div><p style="font-size:13.5px; color:var(--ink-soft); margin:0; line-height:1.6;">${q.explain}</p></div>`;

  const d = document.createElement('div'); d.textContent = str == null ? '' : str; return d.innerHTML;
